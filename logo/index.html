<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logo files: Australian Computational Imaging Workshop</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 32px; background: #f4f4f4; color: #222; }
    h1 { font-weight: 500; margin-top: 0; }
    .logo { margin: 0 0 32px; padding: 24px; border-radius: 6px; max-width: 760px; }
    .logo img { display: block; width: 100%; max-width: 560px; margin-bottom: 16px; }
    .dark { background: #2b2b2b; color: #eee; }
    .light { background: #fff; border: 1px solid #ddd; }
    a { color: inherit; margin-right: 18px; }
  </style>
</head>
<body>
  <h1>Logo files</h1>
  <p>Australian Computational Imaging Workshop. Use the SVG where you can; PNGs are provided for everything else. <a href="../">Back to the workshop site</a></p>

  <div class="logo light">
    <img src="ciworkshop_logo_for_light_backgrounds.svg" alt="Workshop logo for light backgrounds">
    For light backgrounds:
    <a href="ciworkshop_logo_for_light_backgrounds.svg" download>SVG</a>
    <a href="ciworkshop_logo_for_light_backgrounds_2000px.png" download>PNG 2000px</a>
    <a href="ciworkshop_logo_for_light_backgrounds_600px.png" download>PNG 600px</a>
  </div>

  <div class="logo dark">
    <img src="ciworkshop_logo_for_dark_backgrounds.svg" alt="Workshop logo for dark backgrounds">
    For dark backgrounds:
    <a href="ciworkshop_logo_for_dark_backgrounds.svg" download>SVG</a>
    <a href="ciworkshop_logo_for_dark_backgrounds_2000px.png" download>PNG 2000px</a>
    <a href="ciworkshop_logo_for_dark_backgrounds_600px.png" download>PNG 600px</a>
  </div>
</body>
</html>
