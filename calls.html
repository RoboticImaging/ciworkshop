<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ═══════════════════════════════════════════════════════════════
     META  —  edit titles, description, URL in content.js → SITE
════════════════════════════════════════════════════════════════ -->
<title>Call for Posters and Workshops — Australian Computational Imaging Workshop</title>
<meta name="description" content="Call for posters and workshops at the Australian Computational Imaging Workshop. Call details and submission instructions forthcoming.">
<meta property="og:title" content="Call for Posters and Workshops — Australian Computational Imaging Workshop">
<meta property="og:description" content="Poster and workshop call details and submission instructions forthcoming.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ciworkshop.au/calls.html">

<!-- ═══════════════════════════════════════════════════════════════
     FONTS
════════════════════════════════════════════════════════════════ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">

<!-- ═══════════════════════════════════════════════════════════════
     STYLES
════════════════════════════════════════════════════════════════ -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════
     PAGE MOUNT POINT  —  content.js + layout.js write into #app
════════════════════════════════════════════════════════════════ -->
<div id="app"></div>

<!-- ═══════════════════════════════════════════════════════════════
     SCRIPTS  —  load order matters:
       1. content.js   defines SITE (all editable data)
       2. layout.js    reads SITE and builds the DOM
       3. visual.js    mounts the background canvas + lens rig
════════════════════════════════════════════════════════════════ -->
<script src="content.js"></script>
<script src="calls-content.js"></script>
<script src="layout.js"></script>
<script src="visual.js"></script>

</body>
</html>
